[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "specfuse"
version = "0.9.0"
description = "Specfuse umbrella CLI — bridges the pip-installed driver and the Claude Code plugin (init / upgrade)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
  { name = "Specfuse contributors" },
]
keywords = ["specfuse", "gate-cycle", "cli", "bridge"]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Intended Audience :: Developers",
  "Topic :: Software Development",
]
# The umbrella depends on the driver. `pip install specfuse` pulls specfuse-loop.
# Pinned >=0.3.0: the CLI's init/upgrade rewire (FEAT-2026-0028 gate 2) calls
# `specfuse.loop.scaffold`, which only exists in specfuse-loop 0.3.0+ (added by
# FEAT-2026-0026). A 0.2.x driver would import-fail at `specfuse init`.
dependencies = [
  "specfuse-loop>=0.9.0",
]

[project.optional-dependencies]
# pytest belongs here: tests/ mixes unittest.TestCase suites with pytest-based
# ones (test_publish.py), so the suite cannot run without it. It was absent
# until #92, which forced release.yml and plugin-drift-guard.yml to each
# install pytest by hand; the extra should describe what developing this
# package actually needs.
dev = ["coverage>=7.0", "pytest>=7.0", "ruff>=0.6"]
# Opt-in extra: the multi-repo initiative-coordination component. NOT a default
# dependency (unlike specfuse-loop) — it runs at one coordination point, not in
# every consumer. `pipx install specfuse[orchestrator]`.
orchestrator = ["specfuse-orchestrator>=0.4.1"]
# Opt-in extra: the spec-authoring kit (design/validate OpenAPI/AsyncAPI/Arazzo +
# the specs agent). `pipx install specfuse[authoring]`.
authoring = ["specfuse-authoring>=0.5.4"]
# Everything: the driver (default dep) + orchestrator + authoring, so
# `pipx install specfuse[all]` installs the whole suite in one command.
all = ["specfuse-orchestrator>=0.4.1", "specfuse-authoring>=0.5.4"]

[project.scripts]
specfuse = "specfuse.cli:main"
# Re-export the driver's console scripts so `pipx install specfuse` exposes all
# three on PATH. pipx only surfaces the installed package's OWN entry points,
# not its dependencies' — without these, `specfuse-loop`/`specfuse-lint` (from
# the specfuse-loop dep) would be hidden and users would have to install the
# driver separately or pass --include-deps. The targets resolve against the
# specfuse.loop modules the pinned specfuse-loop>=0.9.0 dependency provides.
specfuse-loop = "specfuse.loop.loop:main"
specfuse-lint = "specfuse.loop.lint_plan:main"

[project.urls]
Homepage = "https://github.com/specfuse/specfuse"
Source = "https://github.com/specfuse/specfuse"
Driver = "https://github.com/specfuse/loop"

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
# Pin the ruleset EXPLICITLY rather than relying on ruff's implicit default.
# ruff 0.16 broadened that default to a large opinionated set (B/SIM/PLW/RUF/I/…);
# a bare config inherits the change overnight, so a version bump alone can turn a
# green gate red — specfuse/loop hit exactly that (~300 findings from an upgrade,
# FEAT-2026-0036) and pinned for the same reason. `dev` floors ruff at >=0.6, which
# resolves to whatever is current, so this repo was fully exposed.
#
# The set below is loop's classic-default pin (E4/E7/E9/F + the targeted
# PLW1510/B/BLE001/S110/TRY004 additions) PLUS the four families that produced the
# findings #92 catalogued: I (import sorting), SIM, EXE, and PLR0402. Those are
# fixed in the same change, so adopting their rules costs nothing now and keeps the
# fixes from silently regressing. The whole `PL` family is deliberately NOT taken:
# it adds PLR0911/PLC0415 findings unrelated to this gate. Widening further stays a
# deliberate decision, never an implicit consequence of upgrading ruff.
select = [
  "E4", "E7", "E9", "F",
  "I", "SIM", "EXE", "PLR0402", "PLW1510",
  "B", "BLE001", "S110", "TRY004",
]

[tool.setuptools.packages.find]
# Contribute to the SHARED `specfuse` PEP 420 namespace (no specfuse/__init__.py) so
# this package's `specfuse.cli` composes with specfuse-loop's `specfuse.loop` rather
# than shadowing it. Ship only the umbrella's own modules.
include = ["specfuse*"]
namespaces = true
