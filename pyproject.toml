[build-system]
requires = ["setuptools>=68"]
# In-tree backend (PEP 517 `backend-path`): wraps setuptools to mirror
# `methodology/` into `specfuse/_methodology/` before every build. `methodology/`
# stays canonical at the repo root — the orchestrator's ownership manifest names
# that path — but a wheel can only carry files inside a package dir, so without
# the mirror the umbrella shipped none of the substrate at all. See _build/backend.py.
build-backend = "backend"
backend-path = ["_build"]

[project]
name = "specfuse"
version = "0.12.1"
description = "Specfuse — the whole script suite (driver, authoring kit, orchestrator) in one install, plus the init/upgrade bridge to the Claude Code plugin."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
  { name = "Specfuse contributors" },
]
keywords = ["specfuse", "gate-cycle", "cli", "bridge"]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Intended Audience :: Developers",
  "Topic :: Software Development",
]
# The umbrella IS the suite: one `pipx install specfuse` / `uv tool install
# specfuse` installs and upgrades every script component. All three are HARD
# dependencies, deliberately — they used to be optional extras
# (`specfuse[authoring]`, `[orchestrator]`, `[all]`) and that model breaks against
# the pipx/uv tool model three ways (see docs/plan-bundle-suite-distribution.md):
#
#   1. Tool installers link only the MAIN package's entry points, so an extra's
#      commands need --include-deps / --with-executables-from to reach PATH —
#      the obvious install was silently incomplete.
#   2. Extras are resolved once at install time and never re-resolved, so
#      `pipx upgrade specfuse` could not pull a newer component. That is what
#      forced the old "bump this floor with every component release" ritual.
#   3. An extra's console scripts share names with the standalone package's, so
#      two supported install paths fought over one name in ~/.local/bin and the
#      loser's upgrades silently changed nothing about what ran.
#
# Hard deps are re-resolved on every upgrade, so the floors below are MINIMUMS
# (the oldest version the umbrella's own code can call) — not upgrade levers.
# No conflict risk: specfuse-loop and specfuse-authoring have no third-party
# runtime deps, and specfuse-orchestrator adds only jsonschema + pyyaml.
#
# specfuse-loop>=0.12.1: this floor is load-bearing for CORRECTNESS, not just for
# a callable symbol. `specfuse init` writes the loop's `.specfuse/schemas/` and
# this package's `.specfuse/methodology/schemas/` into the same repo, and
# `methodology.py` provisions the second one only because the two are
# byte-identical. Loop <0.12.1 vendored the pre-#135 event schemas, so the pair
# disagreed on which work-unit IDs are legal — `/T01H` and `/G1-CLOSE` valid in
# one copy, rejected by the other, with the rule documenting them sitting
# byte-identical beside both (specfuse/loop#1433).
#
# Earlier reasons, all still true: `agent` delegates to `specfuse.agent.run:main`
# (first exists in 0.12.0); the CLI's init/upgrade calls `specfuse.loop.scaffold`
# (0.3.0); it re-exports the monitor/stats mains (0.9.3).
dependencies = [
  "specfuse-loop>=0.12.1",
  "specfuse-orchestrator>=0.4.1",
  "specfuse-authoring>=0.5.6",
]

# `dev` is the ONLY extra left. It describes what developing this package needs,
# not what using the suite needs — the suite is the hard-dependency set above.
[project.optional-dependencies]
# pytest belongs here: tests/ mixes unittest.TestCase suites with pytest-based
# ones (test_publish.py), so the suite cannot run without it. It was absent
# until #92, which forced release.yml and plugin-drift-guard.yml to each
# install pytest by hand; the extra should describe what developing this
# package actually needs.
dev = ["coverage>=7.0", "pytest>=7.0", "ruff>=0.6"]

# `specfuse` is the suite's ONE command. Everything the components used to expose
# as its own flat `specfuse-*` script is now `specfuse <subcommand>` (run, lint,
# monitor, stats, authoring, pm, …) — see DELEGATED_COMMANDS in specfuse/cli.py.
# One name on PATH is what makes a shim collision structurally impossible: the
# flat names are also the standalone packages' console scripts, so two installs
# could fight over them and the loser's upgrades silently changed nothing about
# what ran.
#
# The flat names below are DEPRECATED ALIASES, kept for two releases because the
# scaffold's hooks, verification.yml and skills invoke them by string. Every one
# resolves to `specfuse.cli:alias_main`, which recovers the invoked name from
# sys.argv[0], prints the replacement once, and delegates — so this table stays
# one line per command and cannot drift from DELEGATED_COMMANDS. They are removed
# in 1.0.0. See docs/plan-bundle-suite-distribution.md.
[project.scripts]
specfuse = "specfuse.cli:main"
# Deprecated aliases — use `specfuse <subcommand>`.
specfuse-loop = "specfuse.cli:alias_main"
specfuse-lint = "specfuse.cli:alias_main"
specfuse-monitor = "specfuse.cli:alias_main"
specfuse-monitor-lint = "specfuse.cli:alias_main"
specfuse-stats = "specfuse.cli:alias_main"
# Born deprecated, deliberately: `specfuse-agent` is the loop's OWN console
# script (new in loop 0.12.0), and pipx/uv expose only the main package's entry
# points — so without this line the name loop's own docs use is simply absent
# from a suite install. Declaring it keeps that invocation working and routes it
# through the notice pointing at `specfuse agent`. Removed in 1.0.0 with the rest.
specfuse-agent = "specfuse.cli:alias_main"
specfuse-authoring = "specfuse.cli:alias_main"
specfuse-orchestrator = "specfuse.cli:alias_main"
specfuse-poller = "specfuse.cli:alias_main"
specfuse-runner = "specfuse.cli:alias_main"
specfuse-validate-event = "specfuse.cli:alias_main"
specfuse-validate-frontmatter = "specfuse.cli:alias_main"

[project.urls]
Homepage = "https://github.com/specfuse/specfuse"
Source = "https://github.com/specfuse/specfuse"
Driver = "https://github.com/specfuse/loop"

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
# Pin the ruleset EXPLICITLY rather than relying on ruff's implicit default.
# ruff 0.16 broadened that default to a large opinionated set (B/SIM/PLW/RUF/I/…);
# a bare config inherits the change overnight, so a version bump alone can turn a
# green gate red — specfuse/loop hit exactly that (~300 findings from an upgrade,
# FEAT-2026-0036) and pinned for the same reason. `dev` floors ruff at >=0.6, which
# resolves to whatever is current, so this repo was fully exposed.
#
# The set below is loop's classic-default pin (E4/E7/E9/F + the targeted
# PLW1510/B/BLE001/S110/TRY004 additions) PLUS the four families that produced the
# findings #92 catalogued: I (import sorting), SIM, EXE, and PLR0402. Those are
# fixed in the same change, so adopting their rules costs nothing now and keeps the
# fixes from silently regressing. The whole `PL` family is deliberately NOT taken:
# it adds PLR0911/PLC0415 findings unrelated to this gate. Widening further stays a
# deliberate decision, never an implicit consequence of upgrading ruff.
select = [
  "E4", "E7", "E9", "F",
  "I", "SIM", "EXE", "PLR0402", "PLW1510",
  "B", "BLE001", "S110", "TRY004",
]

[tool.setuptools.packages.find]
# Contribute to the SHARED `specfuse` PEP 420 namespace (no specfuse/__init__.py) so
# this package's `specfuse.cli` composes with specfuse-loop's `specfuse.loop` rather
# than shadowing it. Ship only the umbrella's own modules.
include = ["specfuse*"]
# `_methodology/` is generated build output, not code. Excluding it from package
# discovery keeps it out of the namespace graph, so its files ship deterministically
# as package-data of `specfuse` below rather than being attributed to whichever
# namespace package discovery decides to invent for each subdirectory.
exclude = ["specfuse._methodology*"]
namespaces = true

[tool.setuptools.package-data]
# The mirrored substrate: rules, schemas, and the methodology prose, shipped so
# `specfuse init` can provision them into a repo instead of a human copying them
# out of git. Generated by _build/backend.py; gitignored.
"specfuse" = ["_methodology/**/*"]
