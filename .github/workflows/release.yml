#
# Release: on a `v*` tag, build the wheel + sdist for the `specfuse` umbrella CLI,
# run its test suite against the built artifact, then publish to PyPI via OIDC trusted
# publishing. The umbrella depends on specfuse-loop; since the FEAT-2026-0028 rewire,
# specfuse.cli imports specfuse.loop.scaffold at load time, so the wheel is installed
# WITH deps (the pinned specfuse-loop>=0.3.0 resolves from PyPI). Publish order:
# specfuse-loop first, then specfuse — so the dep is resolvable when this runs.

name: release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build wheel + sdist
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Install the built wheel (with deps) and run tests
        run: |
          python -m venv /tmp/relenv
          /tmp/relenv/bin/python -m pip install --upgrade pip
          WHEEL=$(ls dist/*.whl)
          # Install WITH deps: as of the FEAT-2026-0028 scaffold-API rewire,
          # `specfuse.cli` imports `specfuse.loop.scaffold` at load time, so the
          # smoke import below needs the driver present. The pinned
          # `specfuse-loop>=0.3.0` resolves from PyPI (published first per the
          # coordinated-release order). The old --no-deps path predated the
          # rewire and now fails with ModuleNotFoundError: No module named
          # 'specfuse.loop'.
          # + pytest: tests/ now includes pytest-based suites (test_publish.py for
          # the marketplace publish mechanism), so run under pytest, which also
          # collects the unittest.TestCase suites. `unittest discover` chokes on the
          # pytest imports.
          /tmp/relenv/bin/python -m pip install "$WHEEL" pytest
          /tmp/relenv/bin/python -c "import specfuse.cli as c; print('import OK', c.__version__)"
          /tmp/relenv/bin/specfuse --version
          # Run the test suite from the repo (against the installed package).
          /tmp/relenv/bin/python -m pytest tests/ -q

      - name: Tag/version agreement check
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          CLI=$(python -c "import re;print(re.search(r'__version__\s*=\s*\"([^\"]+)\"',open('specfuse/cli.py').read()).group(1))")
          echo "tag=$TAG pyproject=$PKG cli=$CLI"
          test "$TAG" = "$PKG" || { echo "::error::tag v$TAG != pyproject version $PKG"; exit 1; }
          test "$TAG" = "$CLI" || { echo "::error::tag v$TAG != cli __version__ $CLI"; exit 1; }

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v5
        with:
          name: dist
          path: dist/

  publish:
    needs: build-test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@v5
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI (trusted publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
