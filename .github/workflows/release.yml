#
# Release: on a `v*` tag, build the wheel + sdist for the `specfuse` umbrella,
# run its test suite against the built artifact, then publish to PyPI via OIDC trusted
# publishing.
#
# The umbrella IS the suite: specfuse-loop, specfuse-orchestrator and
# specfuse-authoring are HARD dependencies, so the wheel is installed WITH deps and
# all three resolve from PyPI. Publish order is components first, then specfuse —
# but that only guarantees their publish JOBS finished, NOT that pip can resolve
# them: v0.9.2's build-test failed three minutes after a green component publish
# and went green on an unchanged re-run (#111). The propagation gate below waits
# for the floors instead of assuming; do not drop it back to an ordering
# assumption.

name: release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build wheel + sdist
        run: |
          python -m pip install --upgrade pip build
          python -m build

      # Separate step from the install on purpose: the log must distinguish
      # "waiting for the index" from "the install failed". Folded into the
      # install, a propagation lag surfaces as pip's "could not find a version
      # that satisfies the requirement", which reads as a bad pin or a failed
      # component release and invites the wrong fix. Floors come from
      # pyproject, so this cannot drift from what the wheel actually requires.
      - name: Wait for component floors to be resolvable on PyPI
        run: python -m specfuse.await_pypi pyproject.toml

      - name: Install the built wheel (with deps) and run tests
        run: |
          python -m venv /tmp/relenv
          /tmp/relenv/bin/python -m pip install --upgrade pip
          WHEEL=$(ls dist/*.whl)
          # Install WITH deps: `specfuse.cli` imports `specfuse.loop.scaffold` at
          # load time and dispatches into all three components, so the smoke checks
          # below need them present. They resolve from PyPI (published first per the
          # coordinated-release order). A --no-deps install fails with
          # ModuleNotFoundError: No module named 'specfuse.loop'.
          # + pytest: tests/ now includes pytest-based suites (test_publish.py for
          # the marketplace publish mechanism), so run under pytest, which also
          # collects the unittest.TestCase suites. `unittest discover` chokes on the
          # pytest imports.
          /tmp/relenv/bin/python -m pip install "$WHEEL" pytest
          /tmp/relenv/bin/python -c "import specfuse.cli as c; print('import OK', c.__version__)"
          /tmp/relenv/bin/specfuse --version
          # Run the test suite from the repo (against the installed package).
          /tmp/relenv/bin/python -m pytest tests/ -q

      # The tests assert what pyproject DECLARES; only an install proves what
      # actually lands. The whole point of the bundled distribution is that a plain
      # install puts every command on PATH with no installer flags, so verify the
      # console scripts exist in the venv's bin and that a subcommand dispatches.
      - name: Verify the installed command surface
        run: |
          set -eu
          MISSING=""
          for cmd in specfuse specfuse-loop specfuse-lint specfuse-monitor \
                     specfuse-monitor-lint specfuse-stats specfuse-authoring \
                     specfuse-orchestrator specfuse-poller specfuse-runner \
                     specfuse-validate-event specfuse-validate-frontmatter; do
            [ -x "/tmp/relenv/bin/$cmd" ] || MISSING="$MISSING $cmd"
          done
          if [ -n "$MISSING" ]; then
            echo "::error::console scripts missing from the install:$MISSING"; exit 1
          fi
          echo "all 12 console scripts installed"
          # Dispatch, not just presence: every delegated subcommand must resolve to
          # an importable component main. A component that renames a module would
          # otherwise ship a subcommand that ImportErrors at run time.
          /tmp/relenv/bin/python - <<'PY'
          import importlib
          from specfuse import cli
          for sub, (target, flat, _help) in sorted(cli.DELEGATED_COMMANDS.items()):
              module, _, func = target.partition(":")
              assert callable(getattr(importlib.import_module(module), func)), target
              print(f"  specfuse {sub:<22} -> {target}")
          PY

      - name: Tag/version agreement check
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          CLI=$(python -c "import re;print(re.search(r'__version__\s*=\s*\"([^\"]+)\"',open('specfuse/cli.py').read()).group(1))")
          echo "tag=$TAG pyproject=$PKG cli=$CLI"
          test "$TAG" = "$PKG" || { echo "::error::tag v$TAG != pyproject version $PKG"; exit 1; }
          test "$TAG" = "$CLI" || { echo "::error::tag v$TAG != cli __version__ $CLI"; exit 1; }

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v5
        with:
          name: dist
          path: dist/

  publish:
    needs: build-test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@v5
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI (trusted publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
